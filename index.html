<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- O seu favicon da Arasaka -->
    <link rel="icon" type="image/png" href="img/icon.png.png">
    <title>StickerBridge</title>
    
    <!-- Ligação ao seu ficheiro CSS -->
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <!-- Efeito de fundo brilhante -->
    <div class="bg-glow"></div>

    <!-- Navegação (Topo) -->
    <nav class="navbar">
        <div class="logo-container">
            <span class="logo-text">Sticker<span class="accent">WEB</span></span>
        </div>
        <div class="nav-links">
            <a href="https://github.com/MarkStembark" target="_blank" class="nav-link">GitHub</a>
        </div>
    </nav>

    <!-- Área Principal -->
    <main class="hero">
        <div class="hero-content">
            <div class="badge">Lançamento Oficial</div>
            
            <h1 class="main-title">StickerBridge <br><span class="accent">to Zap</span></h1>
            
            <!-- Descrição que pediu para alterar depois -->
            <p class="description">
                A ponte definitiva entre o TikTok e o seu WhatsApp. Extraia as suas figurinhas favoritas de forma rápida, segura e sem perdas de qualidade.
            </p>

            <!-- Botão de Download (O href aponta para o ficheiro APK) -->
            <div class="download-section">
                <a href="StickerBridge.apk" download="StickerBridge.apk" class="btn-download" id="downloadBtn">
                    <div class="btn-icon">
                        <!-- Ícone SVG de Download -->
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                    </div>
                    <span class="btn-text">Download APK</span>
                </a>
            </div>
        </div>
    </main>

    <footer>
        <p>Desenvolvido por Mark Stembark</p>
    </footer>

    <!-- Ligação ao seu ficheiro JS (Opcional, para efeitos visuais) -->
    <script src="javascript/script.js"></script>
    <!-- Botão Flutuante Canto Inferior Direito -->
    <a href="termos.html" class="floating-btn">Termos de Uso</a>
</body>
</html>
